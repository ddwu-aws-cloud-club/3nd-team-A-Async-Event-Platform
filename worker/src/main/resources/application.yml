server:
  port: 8081

aws:
  region: ap-northeast-2

ddb:
  tables:
    event-capacity: event-capacity
    request-state: request-state
    worker-idempotency: worker-idempotency


sqs:
  queue-url: ${SQS_QUEUE_URL:https://sqs.ap-northeast-2.amazonaws.com/031988646316/async-main-queue}
  dlq-url: ${DLQ_QUEUE_URL:https://sqs.ap-northeast-2.amazonaws.com/031988646316/async-main-dlq}

analytics:
  event:
    source: kr.ac.dongduk.worker
    detail-type: ParticipationProcessed

worker:
  threads: 4

  poll:
    delay-ms: 3000
    wait-seconds: 5
    batch-size: 5

  retry:
    base-seconds: 2
    max-seconds: 60
    max-attempt: 5

  visibility-delay-seconds: 2

